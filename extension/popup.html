<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tab Wraith</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 320px; padding: 18px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    header img { width: 32px; height: 32px; }
    header h1 { font-size: 18px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 22px; }
    .stat small { color: var(--muted); font-size: 11px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
    .stack { display: grid; gap: 8px; }
    .note { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
    .note a { color: var(--accent-2); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <div><h1>Tab Wraith</h1><div class="eyebrow">Tabs don't close. They die.</div></div>
  </header>

  <div class="stats">
    <div class="stat"><b id="haunted">0</b><small>Fading</small></div>
    <div class="stat"><b id="wraiths">0</b><small>Wraiths</small></div>
    <div class="stat"><b id="graves">0</b><small>Graves</small></div>
  </div>

  <div class="row">
    <div><strong>Demo Mode</strong><div class="hint" style="margin:0">Haunts after 30 seconds</div></div>
    <label class="switch" style="margin:0"><input type="checkbox" id="demo" aria-label="Demo Mode"><span></span></label>
  </div>

  <div class="stack">
    <button id="exorcise" class="primary">Exorcise wraiths</button>
    <button id="graveyard">🪦 Open the Graveyard</button>
    <button id="protect">Never haunt this site</button>
    <button id="settings">Settings</button>
  </div>

  <p class="note" id="keyNote" hidden>Epitaphs are using templates. <a href="#" id="addKey">Add an API key</a> for AI-written ones.</p>
  <p class="note" id="lifetime"></p>
  <script src="util.js"></script>
  <script src="popup.js"></script>
</body>
</html>
