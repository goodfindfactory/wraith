<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Graveyard · Tab Wraith</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { min-height: 100vh; background:
      radial-gradient(ellipse at 50% -10%, rgba(124,58,237,.28), transparent 60%), var(--bg); }
    main { max-width: 1100px; margin: 0 auto; padding: 48px 24px 80px; }
    .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    h1 { font-size: clamp(30px, 5vw, 46px); letter-spacing: -.02em; }
    .search { max-width: 320px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
    .stone { position: relative; padding: 28px 20px 18px; text-align: center;
      background: linear-gradient(180deg, #221639, #150d26); border: 1px solid var(--line);
      border-radius: 120px 120px 14px 14px; display: flex; flex-direction: column; gap: 8px;
      animation: rise .5s ease both; }
    .stone .rip { font-size: 12px; letter-spacing: .3em; color: var(--accent-2); }
    .stone .head { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .stone .head img { width: 16px; height: 16px; border-radius: 3px; }
    .stone h2 { font-size: 15px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .stone .epitaph { font-family: Georgia, "Times New Roman", serif; font-style: italic; color: #ddd6fe; min-height: 3em; }
    .stone .epitaph.pending { color: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
    .stone .meta { font-size: 12px; color: var(--muted); }
    .stone .actions { display: flex; gap: 8px; margin-top: 6px; }
    .stone .actions button { flex: 1; padding: 8px 10px; font-size: 13px; }
    .badge { font-size: 10px; letter-spacing: .1em; color: var(--accent-2); text-transform: uppercase; }
    .empty { text-align: center; padding: 80px 20px; border: 1px dashed var(--line); border-radius: 20px; }
    .empty .big { font-size: 56px; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .stone, .stone .epitaph.pending { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div>
        <div class="eyebrow">Tab Wraith</div>
        <h1>The Graveyard</h1>
        <p class="muted" id="count" style="margin:6px 0 0"></p>
      </div>
      <input class="search" id="search" type="search" placeholder="Search the dead…" aria-label="Search graves">
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="big">🪦</div>
      <h2 id="emptyTitle">The ground is undisturbed.</h2>
      <p class="muted" id="emptyText">Leave a few tabs alone. The wraith will find them.</p>
    </div>
  </main>
  <script src="util.js"></script>
  <script src="graveyard.js"></script>
</body>
</html>
